name: Content request
description: Propose a new or updated handbook chapter
labels: [content]
body:
  - type: input
    id: chapter
    attributes:
      label: Chapter or page
      placeholder: e.g. Pricing and engagements
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing or wrong?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
